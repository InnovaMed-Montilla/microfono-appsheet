<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictado Inteligente IA - Dra. Luisa Montilla | Innova Med</title>
  <style>
    :root {
      --bg-dark: #080f1e;
      --card-bg: rgba(15, 23, 42, 0.85);
      --accent-cyan: #00f2fe;
      --accent-magenta: #e040fb;
      --accent-blue: #4facfe;
      --accent-red: #ff4b5c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-glow: rgba(0, 242, 254, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, #112240 0%, #080f1e 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }

    .main-container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(0, 242, 254, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 15px;
    }

    .doctor-info h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .doctor-info p {
      font-size: 13px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-logo img {
      height: 65px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.3));
    }

    /* =========================================
       NUEVO ESTILO VISUALIZADOR (BARRAS FINAS)
       ========================================= */
    .visualizer-container {
      width: 100%;
      height: 130px;
      background: rgba(4, 9, 20, 0.9); /* Un poco más oscuro para contraste */
      border-radius: 12px;
      border: 1px solid rgba(224, 64, 251, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Sombra interior más sutil y limpia */
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5); 
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Barra de Estado */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #64748b;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background-color: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Botones de Control */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #start-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
      color: #ffffff;
      box-shadow: 0 0 15px rgba(224, 64, 251, 0.3);
    }

    #start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(224, 64, 251, 0.6);
    }

    #stop-btn {
      background: rgba(255, 75, 92, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    #stop-btn:hover:not(:disabled) {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 75, 92, 0.4);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Caja de Transcripción */
    textarea {
      width: 100%;
      height: 240px;
      padding: 18px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      resize: vertical;
      line-height: 1.6;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    /* Botón Guardar */
    #save-btn {
      width: 100%;
      padding: 15px;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    #save-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
    }

    .footer-credits {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column-reverse;
        text-align: center;
        gap: 12px;
      }

      .controls {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header">
      <div class="doctor-info">
        <h1>DRA. LUISA MONTILLA</h1>
        <p>Dermatólogo UCV • Caracas</p>
      </div>
      <div class="brand-logo">
        <img src="https://lh3.googleusercontent.com/d/1Tlf8Sn2I2glfRitRd3sbaMan3A1WVaAU" alt="Innova Med Logo">
      </div>
    </div>

    <!-- Visualizador -->
    <div class="visualizer-container">
      <canvas id="waveform"></canvas>
    </div>

    <div class="status-bar">
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="status">Estado: Detenido</span>
      </div>
      <span>Dictado Inteligente IA</span>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn">🎙️ Iniciar Escucha</button>
      <button id="stop-btn" class="btn" disabled>⏹ Pausar</button>
    </div>

    <textarea id="transcript-box" placeholder="El texto dictado por la doctora aparecerá en esta sección de forma continua..."></textarea>

    <button id="save-btn">💾 Guardar Resumen en AppSheet</button>

    <div class="footer-credits">Innova Med Platform • Sistema de Asistencia Clínica Avanzada</div>
  </div>

  <script>
    // Variables Globales - NO MODIFICADAS
    let isListening = false;
    let recognition = null;
    let finalTranscript = '';

    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const saveBtn = document.getElementById('save-btn');
    const statusTxt = document.getElementById('status');
    const statusDot = document.getElementById('status-dot');
    const transcriptBox = document.getElementById('transcript-box');

    // ============================================================
    // 1. INICIALIZACIÓN DE CANVAS Y NUEVO RENDERIZADO DE BARRAS
    // ============================================================
    const canvas = document.getElementById('waveform');
    const canvasCtx = canvas.getContext('2d');

    function resizeCanvas() {
      if (canvas && canvas.parentElement) {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- NUEVO RENDERIZADO DE BARRAS ESTILO 'FINAS' CON DEGRADADO ---
    function drawWaveform() {
      requestAnimationFrame(drawWaveform);
      const width = canvas.width;
      const height = canvas.height;
      if (!width || !height) return;

      canvasCtx.clearRect(0, 0, width, height);

      // Configuración de las barras finas
      const barWidth = 3;       // Anchura mínima (finas)
      const barSpacing = 2;     // Espaciado entre barras
      const totalBars = Math.floor(width / (barWidth + barSpacing));
      const centerY = height / 2;

      // Variables dinámicas para simular la amplitud basándose en isListening
      // Nota: Esto no cambia la funcionalidad de captura de audio, solo la representación visual.
      // Si integraras un AnalyserNode real, usarías sus datos aquí.
      const baseAmp = isListening ? height * 0.45 : 3; // Altura base (activo vs inactivo)
      const randomness = isListening ? 0.3 : 0;      // Nivel de variación aleatoria en activo

      // Pintar cada barra
      for (let i = 0; i < totalBars; i++) {
        const x = i * (barWidth + barSpacing);
        
        // Simular variación dinámica simétrica desde el centro para imitar el efecto de voz
        const distanceFromCenter = Math.abs(i - totalBars / 2) / (totalBars / 2); // 0 (centro) a 1 (bordes)
        const envelope = 1 - Math.pow(distanceFromCenter, 2); // Crea una forma de 'campana'

        // Calcular altura de la barra: Amplitud base * envolvente de forma * variación aleatoria
        let dynamicHeight = baseAmp * envelope * (1 + (Math.random() - 0.5) * randomness);
        
        // Asegurar una altura mínima visible
        if (dynamicHeight < 2) dynamicHeight = 2;

        // Dibujar la barra de forma simétrica desde el centro vertical
        const yTop = centerY - dynamicHeight / 2;
        
        // --- APLICAR PALETA DE COLORES (DEGRADADO CYAN -> MAGENTA) ---
        // Calcular el color en base a la posición X de la barra (0 = Cyan, 1 = Magenta)
        const ratio = i / totalBars;
        const color = getGradientColor('#00f2fe', '#e040fb', ratio);
        
        canvasCtx.fillStyle = color;
        canvasCtx.globalAlpha = 0.85; // Un poco de transparencia para suavidad

        // Renderizado de la barra finas (con bordes ligeramente redondeados para estilo)
        drawRoundedRect(canvasCtx, x, yTop, barWidth, dynamicHeight, 1.5);
      }
      canvasCtx.globalAlpha = 1.0;
    }

    // Función auxiliar para calcular el degradado de color (interpolación lineal RGB)
    function getGradientColor(startColor, endColor, ratio) {
      // Convertir Hex a RGB
      const ah = parseInt(startColor.replace('#', ''), 16),
            ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
            bh = parseInt(endColor.replace('#', ''), 16),
            br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff;
      
      // Interpolar
      const rr = ar + ratio * (br - ar),
            rg = ag + ratio * (bg - ag),
            rb = ab + ratio * (bb - ab);
      
      // Convertir RGB de vuelta a Hex
      return '#' + ((1 << 24) + (Math.round(rr) << 16) + (Math.round(rg) << 8) + Math.round(rb)).toString(16).slice(1);
    }

    // Función auxiliar para dibujar rectángulos redondeados finos
    function drawRoundedRect(ctx, x, y, width, height, radius) {
      if (height < radius * 2) radius = height / 2;
      if (width < radius * 2) radius = width / 2;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
    }

    // Iniciar el renderizado
    drawWaveform();

    // ============================================================
    // 2. CONFIGURACIÓN DEL RECONOCIMIENTO DE VOZ - NO MODIFICADO
    // ============================================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-ES';

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        transcriptBox.value = finalTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        console.error("Error Speech:", event.error);
        if (event.error === 'not-allowed') {
          alert("Por favor, permite el acceso al micrófono en el navegador.");
        }
        statusTxt.innerText = "Error: " + event.error;
        stopDictationUI();
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        } else {
          stopDictationUI();
        }
      };
    } else {
      alert("Navegador no compatible con Web Speech API. Usa Google Chrome o Edge.");
    }

    // ============================================================
    // 3. EVENTOS DE LOS BOTONES - NO MODIFICADO (Funcionalidad Preservada)
    // ============================================================
    startBtn.addEventListener('click', async () => {
      // 1. Solicitar permisos explicitos de micrófono al navegador
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Liberar el stream inmediatamente para dejar el canal libre a SpeechRecognition
        stream.getTracks().forEach(track => track.stop());
      } catch (err) {
        alert("Acceso al micrófono denegado. Habilita los permisos en la barra del navegador.");
        return;
      }

      // 2. Iniciar reconocimiento
      if (recognition && !isListening) {
        finalTranscript = transcriptBox.value;
        if (finalTranscript && !finalTranscript.endsWith(' ')) {
          finalTranscript += ' ';
        }

        isListening = true;
        try {
          recognition.start();
          statusTxt.innerText = "Estado: Escuchando...";
          statusDot.classList.add('active');
          startBtn.disabled = true;
          stopBtn.disabled = false;
        } catch (e) {
          console.error("No se pudo iniciar:", e);
        }
      }
    });

    stopBtn.addEventListener('click', () => {
      if (recognition && isListening) {
        isListening = false;
        recognition.stop();
        stopDictationUI();
      }
    });

    function stopDictationUI() {
      isListening = false;
      statusTxt.innerText = "Estado: Pausado";
      statusDot.classList.remove('active');
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    // ============================================================
    // 4. GUARDAR EN APPSHEET - NO MODIFICADO (Lógica Preservada)
    // ============================================================
    saveBtn.addEventListener('click', async () => {
      const text = transcriptBox.value;

      if (!text.trim()) {
        alert("No hay texto dictado para enviar.");
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const idPaciente = urlParams.get('idPaciente') || urlParams.get('rowId');

      if (!idPaciente) {
        alert("Error: No se encontró el ID del paciente en la URL.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "Guardando...";

      const appId = 'a3e3698a-46e6-4571-a0bd-0e510a8511f0';
      const accessKey = 'V2-u0bT6-W34Ia-4wFIv-Oincz-ddxiG-bMLKB-jb3J7-J5WUl';
      const tableName = 'InformeMedico';

      const nuevoInformeId = "INF-" + Date.now();
      
      const hoy = new Date();
      const dia = String(hoy.getDate()).padStart(2, '0');
      const mes = String(hoy.getMonth() + 1).padStart(2, '0');
      const anio = hoy.getFullYear();
      const fechaHoy = `${dia}/${mes}/${anio}`;

      const payload = {
        "Action": "Add",
        "Properties": {
          "Locale": "es-ES",
          "Timezone": "UTC"
        },
        "Rows": [
          {
            "InformeMedID": nuevoInformeId,
            "IDPaciente": decodeURIComponent(idPaciente).trim(),
            "Fecha": fechaHoy,
            "Transcripción": text.trim()
          }
        ]
      };

      const apiUrl = `https://api.appsheet.com/api/v2/apps/${appId}/tables/${tableName}/Action`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'ApplicationAccessKey': accessKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const resText = await response.text();

        if (response.ok) {
          alert("¡Informe guardado con éxito en AppSheet!");
          try { window.close(); } catch(e) {}
        } else {
          alert(`Error de AppSheet (${response.status}): ${resText}`);
        }
      } catch (error) {
        alert("Error de conexión: " + error.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 Guardar Resumen en AppSheet";
      }
    });
  </script>
</body>
</html>
