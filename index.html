<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictado Continuo Consulta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f4f6f9;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .status {
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
      color: #555;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    #start-btn {
      background-color: #28a745;
      color: white;
    }
    #stop-btn {
      background-color: #dc3545;
      color: white;
    }
    #save-btn {
      background-color: #007bff;
      color: white;
      width: 100%;
      margin-top: 15px;
      font-size: 18px;
    }
    button:disabled {
      background-color: #ccc !important;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      height: 220px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Dictado Continuo Consulta</h2>
    <div id="status" class="status">Estado: Detenido</div>

    <div class="controls">
      <button id="start-btn" onclick="startDictation()">▶ Iniciar Escucha</button>
      <button id="stop-btn" onclick="stopDictation()" disabled>⏹ Pausar</button>
    </div>

    <textarea id="transcript-box" placeholder="El texto dictado aparecerá aquí..."></textarea>

    <button id="save-btn" onclick="sendToAppSheet()">💾 Guardar en Chat / AppSheet</button>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;
    let finalTranscript = '';

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-ES';

      // MANEJO DE RESULTADOS (Evita duplicaciones en Android)
      recognition.onresult = (event) => {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        document.getElementById('transcript-box').value = finalTranscript + interimTranscript;
      };
        
        recognition.onspeechend = () => {
        if (isListening) {
          try {
            recognition.start();
          } catch (e) {}
        }
      };

      recognition.onerror = (event) => {
        console.error("Error en reconocimiento de voz:", event.error);
        document.getElementById('status').innerText = "Error: " + event.error;
      };

      recognition.onend = () => {
        // Si el usuario no lo pausó manualmente, se reinicia automáticamente para mantener dictado continuo
        if (isListening) {
          recognition.start();
        } else {
          document.getElementById('status').innerText = "Estado: Pausado";
          document.getElementById('start-btn').disabled = false;
          document.getElementById('stop-btn').disabled = true;
        }
      };

    } else {
      alert("Tu navegador no soporta el reconocimiento de voz nativo (Web Speech API).");
    }

    function startDictation() {
      if (recognition && !isListening) {
        // Cargar texto previo si el usuario editó manualmente la casilla
        finalTranscript = document.getElementById('transcript-box').value;
        if (finalTranscript && !finalTranscript.endsWith(' ')) {
          finalTranscript += ' ';
        }
        
        isListening = true;
        recognition.start();
        document.getElementById('status').innerText = "Estado: Escuchando...";
        document.getElementById('start-btn').disabled = true;
        document.getElementById('stop-btn').disabled = false;
      }
    }

    function stopDictation() {
      if (recognition && isListening) {
        isListening = false;
        recognition.stop();
      }
    }

    // ENVÍO DE DATOS A APPSHEET

      }

      // Obtener el ID del informe desde los parámetros de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const rowId = urlParams.get('rowId');

        alert("Error: No se encontró el ID del informe (rowId) en la dirección URL.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "Guardando...";

      const nuevoInformeId = "INF-" + Date.now();
      
      // Formato de fecha en día/mes/año (ejemplo: 27/07/2026)

      const mes = String(hoy.getMonth() + 1).padStart(2, '0');

      const payload = {
        "Action": "Add",

          }

        if (response.ok) {

  </script>
</body>
</html>
