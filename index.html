<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictado Inteligente IA - Dra. Luisa Montilla | Innova Med</title>
  <style>
    :root {
      --bg-dark: #080f1e;
      --card-bg: rgba(15, 23, 42, 0.85);
      --accent-cyan: #00f2fe;
      --accent-magenta: #e040fb;
      --accent-blue: #4facfe;
      --accent-red: #ff4b5c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-glow: rgba(0, 242, 254, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, #112240 0%, #080f1e 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }

    .main-container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(0, 242, 254, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 15px;
    }

    .doctor-info h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .doctor-info p {
      font-size: 13px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-logo img {
      height: 65px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.3));
    }

    /* Visualizador */
    .visualizer-container {
      width: 100%;
      height: 140px;
      background: rgba(4, 9, 20, 0.95);
      border-radius: 12px;
      border: 1px solid rgba(224, 64, 251, 0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Barra de Estado */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #64748b;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background-color: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Botones de Control */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #start-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
      color: #ffffff;
      box-shadow: 0 0 15px rgba(224, 64, 251, 0.3);
    }

    #start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(224, 64, 251, 0.6);
    }

    #stop-btn {
      background: rgba(255, 75, 92, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    #stop-btn:hover:not(:disabled) {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 75, 92, 0.4);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Caja de Transcripción */
    textarea {
      width: 100%;
      height: 240px;
      padding: 18px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      resize: vertical;
      line-height: 1.6;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    /* Botón Guardar */
    #save-btn {
      width: 100%;
      padding: 15px;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    #save-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
    }

    .footer-credits {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column-reverse;
        text-align: center;
        gap: 12px;
      }

      .controls {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header">
      <div class="doctor-info">
        <h1>DRA. LUISA MONTILLA</h1>
        <p>Dermatología UCV • Caracas</p>
      </div>
      <div class="brand-logo">
        <img src="https://lh3.googleusercontent.com/d/1Tlf8Sn2I2glfRitRd3sbaMan3A1WVaAU" alt="Innova Med Logo">
      </div>
    </div>

    <!-- Visualizador -->
    <div class="visualizer-container">
      <canvas id="waveform"></canvas>
    </div>

    <div class="status-bar">
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="status">Estado: Detenido</span>
      </div>
      <span>Dictado Inteligente IA</span>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn">🎙️ Iniciar Escucha</button>
      <button id="stop-btn" class="btn" disabled>⏹ Pausar</button>
    </div>

    <textarea id="transcript-box" placeholder="El texto dictado por la doctora aparecerá en esta sección de forma continua..."></textarea>

    <button id="save-btn">💾 Guardar Resumen en AppSheet</button>

    <div class="footer-credits">Innova Med Platform • Sistema de Asistencia Clínica Avanzada</div>
  </div>

  <script>
    // Variables Globales
    let isListening = false;
    let recognition = null;
    let finalTranscript = '';

    // Variables Audio Web API (Para captura suave de volumen)
    let audioCtx = null;
    let analyser = null;
    let microphoneStream = null;
    let dataArray = null;
    let currentVolume = 0;

    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const saveBtn = document.getElementById('save-btn');
    const statusTxt = document.getElementById('status');
    const statusDot = document.getElementById('status-dot');
    const transcriptBox = document.getElementById('transcript-box');

    // ==========================================
    // 1. INICIALIZACIÓN DE CANVAS Y BARRAS SUAVES
    // ==========================================
    const canvas = document.getElementById('waveform');
    const canvasCtx = canvas.getContext('2d');
    let phase = 0;

    function resizeCanvas() {
      if (canvas && canvas.parentElement) {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWaveform() {
      requestAnimationFrame(drawWaveform);
      const width = canvas.width;
      const height = canvas.height;
      if (!width || !height) return;

      canvasCtx.clearRect(0, 0, width, height);

      // Calcular volumen real suave si hay flujo activo
      let targetVolume = 0;
      if (isListening && analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        targetVolume = sum / dataArray.length / 255; // Escala 0.0 a 1.0
      }

      // Transición suave (Interpolación lineal) para eliminar vibración brusca
      currentVolume += (targetVolume - currentVolume) * 0.15;
      phase += isListening ? 0.04 : 0.01;

      const barWidth = 3;
      const barGap = 3;
      const totalBars = Math.floor(width / (barWidth + barGap));
      const centerY = height / 2;

      // Crear degradado Horizontal Cyan -> Magenta
      const gradient = canvasCtx.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, '#00f2fe');
      gradient.addColorStop(0.5, '#7c4dff');
      gradient.addColorStop(1, '#e040fb');

      canvasCtx.fillStyle = gradient;

      for (let i = 0; i < totalBars; i++) {
        const x = i * (barWidth + barGap);
        const normX = (i / totalBars) * Math.PI * 2;

        // Modulación por envolvente sinusoidal suave estilo onda comprimida
        const wave1 = Math.sin(normX * 3 + phase) * 0.35;
        const wave2 = Math.cos(normX * 6 - phase * 1.5) * 0.25;
        const shapeEnvelope = Math.sin((i / totalBars) * Math.PI); // Forma redondeada centrada

        // Altura base cuando está quieto
        const idleHeight = (Math.sin(normX * 4 + phase) * 0.15 + 0.85) * 6 * shapeEnvelope;
        
        // Altura activa modulada por el volumen de voz real
        const activeHeight = (0.35 + wave1 + wave2) * (height * 0.85) * currentVolume * shapeEnvelope;

        const barHeight = Math.max(3, isListening ? activeHeight : idleHeight);
        const y = centerY - barHeight / 2;

        // Dibujar barras finas con puntas redondeadas
        canvasCtx.beginPath();
        if (canvasCtx.roundRect) {
          canvasCtx.roundRect(x, y, barWidth, barHeight, barWidth / 2);
        } else {
          canvasCtx.rect(x, y, barWidth, barHeight);
        }
        canvasCtx.fill();
      }
    }
    drawWaveform();

    // ==========================================
    // 2. CONFIGURACIÓN DEL RECONOCIMIENTO DE VOZ
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-ES';

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        transcriptBox.value = finalTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        console.error("Error Speech:", event.error);
        if (event.error === 'not-allowed') {
          alert("Por favor, permite el acceso al micrófono en el navegador.");
        }
        statusTxt.innerText = "Error: " + event.error;
        stopDictationUI();
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        } else {
          stopDictationUI();
        }
      };
    } else {
      alert("Navegador no compatible con Web Speech API. Usa Google Chrome o Edge.");
    }

    // ==========================================
    // 3. EVENTOS DE LOS BOTONES
    // ==========================================
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        microphoneStream = stream;

        // Configurar analizador de volumen en vivo sin interferir con Speech
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.8; // Suaviza transiciones de ruido
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);

      } catch (err) {
        alert("Acceso al micrófono denegado. Habilita los permisos en la barra del navegador.");
        return;
      }

      if (recognition && !isListening) {
        finalTranscript = transcriptBox.value;
        if (finalTranscript && !finalTranscript.endsWith(' ')) {
          finalTranscript += ' ';
        }

        isListening = true;
        try {
          recognition.start();
          statusTxt.innerText = "Estado: Escuchando...";
          statusDot.classList.add('active');
          startBtn.disabled = true;
          stopBtn.disabled = false;
        } catch (e) {
          console.error("No se pudo iniciar:", e);
        }
      }
    });

    stopBtn.addEventListener('click', () => {
      if (recognition && isListening) {
        isListening = false;
        recognition.stop();
        stopDictationUI();
      }
    });

    function stopDictationUI() {
      isListening = false;
      statusTxt.innerText = "Estado: Pausado";
      statusDot.classList.remove('active');
      startBtn.disabled = false;
      stopBtn.disabled = true;

      // Limpiar recursos de audio del visualizador
      if (microphoneStream) {
        microphoneStream.getTracks().forEach(track => track.stop());
        microphoneStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }

    // ==========================================
    // 4. GUARDAR EN APPSHEET
    // ==========================================
    saveBtn.addEventListener('click', async () => {
      const text = transcriptBox.value;

      if (!text.trim()) {
        alert("No hay texto dictado para enviar.");
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const idPaciente = urlParams.get('idPaciente') || urlParams.get('rowId');

      if (!idPaciente) {
        alert("Error: No se encontró el ID del paciente en la URL.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "Guardando...";

      const appId = 'a3e3698a-46e6-4571-a0bd-0e510a8511f0';
      const accessKey = 'V2-u0bT6-W34Ia-4wFIv-Oincz-ddxiG-bMLKB-jb3J7-J5WUl';
      const tableName = 'InformeMedico';

      const nuevoInformeId = "INF-" + Date.now();
      
      const hoy = new Date();
      const dia = String(hoy.getDate()).padStart(2, '0');
      const mes = String(hoy.getMonth() + 1).padStart(2, '0');
      const anio = hoy.getFullYear();
      const fechaHoy = `${dia}/${mes}/${anio}`;

      const payload = {
        "Action": "Add",
        "Properties": {
          "Locale": "es-ES",
          "Timezone": "UTC"
        },
        "Rows": [
          {
            "InformeMedID": nuevoInformeId,
            "IDPaciente": decodeURIComponent(idPaciente).trim(),
            "Fecha": fechaHoy,
            "Transcripción": text.trim()
          }
        ]
      };

      const apiUrl = `https://api.appsheet.com/api/v2/apps/${appId}/tables/${tableName}/Action`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'ApplicationAccessKey': accessKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const resText = await response.text();

        if (response.ok) {
          alert("¡Informe guardado con éxito en AppSheet!");
          try { window.close(); } catch(e) {}
        } else {
          alert(`Error de AppSheet (${response.status}): ${resText}`);
        }
      } catch (error) {
        alert("Error de conexión: " + error.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 Guardar Resumen en AppSheet";
      }
    });
  </script>
</body>
</html>
